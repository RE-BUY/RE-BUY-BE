version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: rebuy-postgres
    environment:
      POSTGRES_DB: rebuy
      POSTGRES_USER: rebuy_user
      POSTGRES_PASSWORD: rebuy_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # db_init.sql 제거 - JPA가 자동으로 테이블 생성
    networks:
      - rebuy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rebuy_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rebuy-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rebuy
      SPRING_DATASOURCE_USERNAME: rebuy_user
      SPRING_DATASOURCE_PASSWORD: rebuy_password
      UPSTAGE_API_KEY: ${UPSTAGE_API_KEY}
      JWT_SECRET: ${JWT_SECRET:-rebuy-secret-key-for-jwt-token-generation-2024-change-this-in-prod-very-long-string-xyz}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rebuy-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  rebuy-network:
    driver: bridge

