version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: rebuy-postgres
    environment:
      POSTGRES_DB: rebuy
      POSTGRES_USER: rebuy_user
      POSTGRES_PASSWORD: rebuy_password
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db_init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rebuy_user -d rebuy"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

