server:
  port: 8080

spring:
  application:
    name: rebuy-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/rebuy
    username: rebuy_user
    password: rebuy_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  redis:
    host: localhost
    port: 6379
    timeout: 2000ms

# JWT 설정
jwt:
  secret: rebuy-secret-key-for-jwt-token-generation-2024
  expiration: 86400000 # 24시간

# Swagger 설정
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html