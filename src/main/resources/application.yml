server:
  port: 8080

spring:
  application:
    name: rebuy-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/rebuy
    username: rebuy_user
    password: rebuy_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  show-sql: true
  data:
    redis:
      host: localhost
      timeout: 2000ms
      port: 6379

jwt:
  secret: rebuy-secret-key-for-jwt-token-generation-2024-change-this-in-prod-very-long-string-xyz
  expiration: 7200000

eco:
  weight:
    co2: 0.8
    water: 0.05
    oil: 0.10
    plastic: 0.15

upstage:
  api:
    url: https://api.upstage.ai/v1/solar
    key: ${UPSTAGE_API_KEY:your-api-key-here}
    model: solar-pro-2
    timeout: 30000
