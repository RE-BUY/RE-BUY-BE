server:
  port: 8080

spring:
  application:
    name: rebuy-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/rebuy
    username: rebuy_user
    password: rebuy_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  data:
    redis:
      host: localhost
      timeout: 2000ms
      port: 6379

jwt:
  secret: rebuy-secret-key-for-jwt-token-generation-2024-change-this-in-prod-very-long-string-xyz
  expiration: 7200000